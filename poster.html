<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXIF-Guard Poster | Fadhly.dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="poster.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
</head>
<body>

<header class="site">
  <nav class="wrap nav">
    <a href="index.html#projects" class="btn ghost"><i data-lucide="arrow-left" class="sm"></i>Back</a>
    <a href="index.html" class="logo">Fadhly<span>.dev</span></a>
  </nav>
</header>

<main class="wrap poster-page">
  <div class="center">
    <span class="eyebrow">Featured Project</span>
    <h1>EXIF-Guard Poster</h1>
    <p class="sub">An automated image metadata forensic analyzer &amp; privacy sanitization tool: Zero-Trust Metadata Intelligence.</p>
  </div>

  <div class="poster-actions">
    <button id="fsBtn" class="btn"><i data-lucide="maximize" class="sm"></i>Open fullscreen</button>
    <a class="btn ghost" href="EXIF-Guard-Poster.jpg" download="EXIF-Guard-Poster.jpg"><i data-lucide="download" class="sm"></i>Download JPG</a>
  </div>

  <figure id="stage" class="poster-stage">
    <img id="poster" src="EXIF-Guard-Poster.jpg" alt="EXIF-Guard research poster: introduction, objectives, related works, methodology, proposed solution, commercialization, impact and conclusion">
    <button id="exitBtn" class="btn ghost exit" aria-label="Close fullscreen"><i data-lucide="x" class="sm"></i>Close</button>
  </figure>
</main>

<script>
const stage = document.getElementById('stage');
const isFull = () => stage.classList.contains('is-full');

function openFull() {
  stage.classList.add('is-full');
  // Real fullscreen where supported; the fixed overlay is the fallback (e.g. iPhone Safari)
  if (stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
}
function closeFull() {
  stage.classList.remove('is-full', 'zoom');
  if (document.fullscreenElement) document.exitFullscreen();
}

document.getElementById('fsBtn').onclick = openFull;
document.getElementById('exitBtn').onclick = closeFull;
// In fullscreen, clicking the poster toggles between fit-to-screen and a larger readable size
document.getElementById('poster').onclick = () => isFull() ? stage.classList.toggle('zoom') : openFull();
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) closeFull(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && isFull()) closeFull(); });

lucide.createIcons();
</script>
</body>
</html>
